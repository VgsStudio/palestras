name: Deploy palestras

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-palestras
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build manifest
        run: node scripts/build-manifest.mjs

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::605914448173:role/github-actions-talks-deploy
          aws-region: us-east-1

      - name: Sync to S3
        run: aws s3 sync dist/ s3://vitorportfolio-site-sitebucket397a1860-5squowxf4mji/materiais/ --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id E1ZT84FT2A52YB --paths "/materiais/*"
